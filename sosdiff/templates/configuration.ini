[main]
; Print plain text without colors.
text = False
; Show `diff` when file content don't match. 
diff = False
; Exlude file list.
; Some files are exluded to avoid "Too many levels of symbolic links" errors
; Refer to `self.excluded_href` method at https://github.com/pafernanr/sosdiff/blob/main/sosdiff/lib/util.py
; Below are recomended values
exclude_files = 
  '^/date$',
  '^/df$',
  '^/free$',
  '^/sos_commands/.*/journalctl_.*$',
  '^/sos_commands/logs/.*$',
  '^/sos_strings/.*var\.log.*\.tailed$',
  '^/ps$',
  '^/var/log/.*$',
  '^/uptime$',
; Include files mathing this regex
# include_files = '^/path/to/.*$', '^/path/to/file$
; Enable these plugins only
# only_plugins = 'foreman', 'subscription_manager'
; Disable these plugins
# skip_plugins = 'foreman', 'subscription_manager'