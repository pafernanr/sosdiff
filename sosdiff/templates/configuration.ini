[main]
; Print plain text without colors.
text = false
; Show `diff` when file content don't match.
diff = false
; Exlude file list.
; Some files are automatically exluded to avoid "Too many levels of symbolic links" errors
; Refer to `self.excluded_href` at https://github.com/pafernanr/sosdiff/blob/main/sosdiff/lib/util.py#L20
; Below are recomended values
exclude_files = 
  '^/date$',
  '^/df$',
  '^/free$',
  '^/proc/[0-9]+/.*$',
  '^/sos_commands/date/date.*$',
  '^/sos_commands/date/hwclock$',
  '^/sos_commands/.*/journalctl_.*$',
  '^/sos_commands/logs/.*$',
  '^/sos_strings/.*var\.log.*\.tailed$',
  '^/ps$',
  '^/uptime$',
  '^/var/log/.*$',
  '\.log$',
  '\.bak$',
  '^/sos_commands/ebpf/bpftool_.*_id_[0-9]+$',
  '^/sos_commands/foreman/dynflow_actions',
  '^/sos_commands/foreman/dynflow_execution_plans',
  '^/sos_commands/foreman/foreman_tasks_tasks',
  '^/sos_commands/pulpcore/core_.*$',
  '^/sos_commands/pulpcore/pulpcore_db_tables_sizes$'
; Include only files mathing this regex
# include_files = '^/path/to/.*$', '^/path/to/file$
; Enable these plugins only
# only_plugins = 'foreman', 'subscription_manager'
; Disable these plugins
skip_plugins = 'cgroups', 'dbus', 'process'
